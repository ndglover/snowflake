# Watches conventional-commit pushes to main and maintains a release PR for
# AdbcDrivers.Snowflake. Merging that PR is what creates the dotnet/v* tag
# and GitHub release that dotnet_release.yaml then builds and publishes.
name: Dotnet Tag

on:
  push:
    branches:
      - main
      - Workflow # TEMPORARY: dry-running the pipeline without touching main, remove before merging upstream
    paths:
      - 'csharp/src/AdbcDrivers.Snowflake/**'
      - 'csharp/Directory.Build.props'
      - 'release-please-config.json'

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
